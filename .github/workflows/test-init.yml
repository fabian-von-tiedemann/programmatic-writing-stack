name: Test init-writing-stack.sh

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-init:
    name: Smoke-test init på ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify init-script is executable
        run: |
          chmod +x init-writing-stack.sh
          chmod +x templates/scripts/*.sh templates/scripts/*.py
          ls -la init-writing-stack.sh

      - name: Run init-writing-stack.sh
        run: |
          ./init-writing-stack.sh /tmp/test-project "Testbok" thriller

      - name: Verify project structure
        run: |
          cd /tmp/test-project

          # Verify catalog structure
          test -d .context/roles || (echo "MISSING .context/roles/" && exit 1)
          test -d .context/hantverk || (echo "MISSING .context/hantverk/" && exit 1)
          test -d .context/story-graph || (echo "MISSING .context/story-graph/" && exit 1)
          test -d .context/koncept || (echo "MISSING .context/koncept/" && exit 1)
          test -d .context/plot || (echo "MISSING .context/plot/" && exit 1)
          test -d scripts || (echo "MISSING scripts/" && exit 1)

          # Verify core files
          test -f CLAUDE.md || (echo "MISSING CLAUDE.md" && exit 1)
          test -f docs/programmatic-writing-stack-PRD.md || (echo "MISSING PRD" && exit 1)
          test -f scripts/grep-tics.sh || (echo "MISSING grep-tics.sh" && exit 1)

          # Verify 13 role briefs
          ROLE_COUNT=$(ls .context/roles/*.md | wc -l)
          if [ "$ROLE_COUNT" -lt 13 ]; then
            echo "Expected ≥13 roller, found $ROLE_COUNT"
            exit 1
          fi

          # Verify placeholders replaced
          if grep -q "{{BOK_TITEL}}" CLAUDE.md; then
            echo "Placeholder {{BOK_TITEL}} not replaced in CLAUDE.md"
            exit 1
          fi
          if grep -q "{{GENRE}}" CLAUDE.md; then
            echo "Placeholder {{GENRE}} not replaced in CLAUDE.md"
            exit 1
          fi

          # Verify book title applied
          grep -q "Testbok" CLAUDE.md || (echo "Bok-titel not applied" && exit 1)

      - name: Verify git initialized
        run: |
          cd /tmp/test-project
          test -d .git || (echo "MISSING .git/" && exit 1)
          git log --oneline | head -5

      - name: Verify scripts are valid bash/python
        run: |
          cd /tmp/test-project
          for script in scripts/*.sh; do
            bash -n "$script" || (echo "SYNTAX ERROR in $script" && exit 1)
          done
          for script in scripts/*.py; do
            python3 -m py_compile "$script" || (echo "SYNTAX ERROR in $script" && exit 1)
          done

      - name: Test --dry-run mode
        run: |
          ./init-writing-stack.sh /tmp/dry-run-test "DryRunBok" thriller --dry-run || \
            ./init-writing-stack.sh --dry-run /tmp/dry-run-test "DryRunBok" thriller || true
          # Verify dry-run didn't create dir
          test ! -d /tmp/dry-run-test || echo "Note: --dry-run created dir (acceptable if flagged)"

      - name: Test --no-git mode
        run: |
          ./init-writing-stack.sh /tmp/no-git-test "NoGitBok" thriller --no-git
          test -d /tmp/no-git-test || (echo "no-git target not created" && exit 1)
          test ! -d /tmp/no-git-test/.git || echo "Note: .git exists despite --no-git (verify flag handling)"

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/test-project /tmp/dry-run-test /tmp/no-git-test

  lint-scripts:
    name: Shellcheck + Python lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck init-script
        run: shellcheck init-writing-stack.sh || true

      - name: Shellcheck templates/scripts/*.sh
        run: |
          for f in templates/scripts/*.sh; do
            shellcheck "$f" || true
          done

      - name: Python syntax check
        run: |
          for f in templates/scripts/*.py; do
            python3 -m py_compile "$f"
          done

  validate-templates:
    name: Validera template-struktur
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify required template dirs
        run: |
          REQUIRED_DIRS=(
            "templates/.context/roles"
            "templates/.context/hantverk"
            "templates/.context/story-graph"
            "templates/.context/koncept"
            "templates/.context/plot"
            "templates/.context/stil"
            "templates/.context/forlag"
            "templates/.context/meta"
            "templates/scripts"
            "templates/docs"
          )
          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "MISSING: $dir"
              exit 1
            fi
            echo "OK: $dir"
          done

      - name: Verify JSON files are valid
        run: |
          for f in templates/.context/story-graph/*.json; do
            python3 -c "import json; json.load(open('$f'))" || \
              (echo "INVALID JSON: $f" && exit 1)
            echo "OK: $f"
          done

      - name: Verify 13 role briefs exist
        run: |
          EXPECTED_ROLES=(
            "writer" "redaktor" "prosa-stad" "nagelfaren" "forlaggare"
            "plot-arkitekt" "researcher" "dialog-coach" "sensitivity-lasare"
            "graf-vakt" "varldsbyggare" "audiobook-direktor" "marknadsforare"
          )
          for role in "${EXPECTED_ROLES[@]}"; do
            if [ ! -f "templates/.context/roles/$role.md" ]; then
              echo "MISSING ROLE: $role.md"
              exit 1
            fi
          done
          echo "All 13 roller present"

      - name: Verify hantverk-bibliotek
        run: |
          REQUIRED_HANTVERK=(
            "tekniker"
            "kvalitetsgrindar"
            "snabb-checklista"
            "anti-monster"
          )
          for f in "${REQUIRED_HANTVERK[@]}"; do
            if [ ! -f "templates/.context/hantverk/$f.md" ]; then
              echo "MISSING HANTVERK: $f.md"
              exit 1
            fi
          done

      - name: Check no Marken-specific content leaks
        run: |
          FORBIDDEN_TERMS=("Anna Lidman" "Daniel Wallin" "Erika Lindh" "Marken under marken" "Smöjen" "Gotland" "Almedalen")
          FOUND=0
          for term in "${FORBIDDEN_TERMS[@]}"; do
            # Allow in PRD/HTML (it's a case study reference)
            MATCHES=$(grep -rn --include="*.md" --exclude-dir="docs" "$term" templates/ 2>/dev/null | wc -l)
            if [ "$MATCHES" -gt 0 ]; then
              echo "WARNING: Marken-content leaked: '$term' ($MATCHES matches)"
              grep -rn --include="*.md" --exclude-dir="docs" "$term" templates/ | head -5
              FOUND=$((FOUND + MATCHES))
            fi
          done
          if [ "$FOUND" -gt 0 ]; then
            echo "Total Marken-content leaks: $FOUND"
            # Inte fail - just warning. Vissa kan vara legitima (i case study-context).
          fi
